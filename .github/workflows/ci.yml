name: CI

on:
  # Branch pushes are covered by their pull request: running on every push too
  # ran the whole CI twice per commit of a PR branch (Actions quota).
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR supersedes the run in progress; runs on main
# always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as the Dockerfile's node:<major>-alpine base image: test
          # the runtime that actually ships.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r bridge/requirements.txt
      - run: python -m py_compile bridge/hq_bridge.py
      # Import-only smoke test: catches a hydroqc release that renames/removes
      # something this bridge relies on (WebUser, ContractDCPC/DPC, OutageStatus...)
      # without needing real Hydro-Québec credentials.
      - run: python -c "import sys; sys.path.insert(0, 'bridge'); import hq_bridge; print(sorted(hq_bridge.COMMANDS))"

  docker:
    # Actually builds the image (single-arch, no push): a Dockerfile-only
    # change (base image bump, apk/pip package changes...) is invisible to
    # the "node"/"bridge" jobs above, which never touch Docker at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gladys-hydro-quebec:ci
