name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r bridge/requirements.txt
      - run: python -m py_compile bridge/hq_bridge.py
      # Import-only smoke test: catches a hydroqc release that renames/removes
      # something this bridge relies on (WebUser, ContractDCPC/DPC, OutageStatus...)
      # without needing real Hydro-Québec credentials.
      - run: python -c "import sys; sys.path.insert(0, 'bridge'); import hq_bridge; print(sorted(hq_bridge.COMMANDS))"
