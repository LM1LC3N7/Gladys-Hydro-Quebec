name: Release

# Bumps the version in gladys-assistant-integration.json + package.json (or
# releases the version already in the manifest as-is, with "current" - e.g.
# the first release), tags it, publishes an actual GitHub Release, and
# builds/pushes a multi-arch image to ghcr.io - all in one run, so creating a
# release always builds and publishes its image; there is no separate manual
# docker step and no second workflow that could fail to be triggered.
# Run it from the Actions tab (Release -> Run workflow -> pick a bump).
#
# One-time manual setup this workflow depends on (cannot be done from here):
#   - After the FIRST successful run: the repo's "Packages" sidebar links to
#     the new ghcr.io package -> Package settings -> Change visibility ->
#     Public. A private package cannot be pulled by a Gladys instance (no
#     registry credentials exist anywhere in the external-integration
#     protocol).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump ('current' releases the manifest's existing version as-is, e.g. the first release)"
        required: true
        default: 'patch'
        type: choice
        options: [current, patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the release version
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./gladys-assistant-integration.json').version")
          if [ "${{ inputs.bump }}" = "current" ]; then
            NEW_VERSION="$CURRENT"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW_VERSION already exists - pick a different bump." >&2
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$NEW_VERSION" != "$CURRENT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Bump version in the manifest and package.json
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const manifestPath = 'gladys-assistant-integration.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '${{ steps.bump.outputs.version }}';
            manifest.docker_image = manifest.docker_image.replace(/:[^:]+\$/, ':${{ steps.bump.outputs.version }}');
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '${{ steps.bump.outputs.version }}';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gladys-assistant-integration.json package.json
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag
        run: |
          set -euo pipefail
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Compute lowercase image name
        id: image
        # ghcr.io requires a lowercase path; GitHub Actions expressions have
        # no built-in lowercase function, so this runs through the shell.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.bump.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
