name: Release

# Bumps the version in gladys-assistant-integration.json + package.json,
# tags it, and builds/pushes a multi-arch image to ghcr.io. Run it from the
# Actions tab (Release -> Run workflow -> pick patch/minor/major).
#
# One-time manual setup this workflow depends on (cannot be done from here):
#   - Settings -> Actions -> General -> Workflow permissions -> "Read and
#     write permissions" (so GITHUB_TOKEN can push the release commit/tag
#     and the image).
#   - After the FIRST successful run: the repo's "Packages" sidebar links to
#     the new ghcr.io package -> Package settings -> Change visibility ->
#     Public. A private package cannot be pulled by a Gladys instance (no
#     registry credentials exist anywhere in the external-integration
#     protocol).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in the manifest and package.json
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./gladys-assistant-integration.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          node -e "
            const fs = require('fs');
            const manifestPath = 'gladys-assistant-integration.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '$NEW_VERSION';
            manifest.docker_image = manifest.docker_image.replace(/:[^:]+\$/, ':$NEW_VERSION');
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gladys-assistant-integration.json package.json
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Compute lowercase image name
        id: image
        # ghcr.io requires a lowercase path; GitHub Actions expressions have
        # no built-in lowercase function, so this runs through the shell.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.bump.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
